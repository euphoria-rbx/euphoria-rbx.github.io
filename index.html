me:HttpGet("https://euphoria-rbx.github.io/Crystal", true))()</div><button class=copy-btn>Copy</button></div><audio id="bg-music" autoplay loop><source src="Everyone Knows - Slowdive.mp3" type="audio/mpeg"></audio><script>document.querySelectorAll('.copy-btn').forEach(button => {
